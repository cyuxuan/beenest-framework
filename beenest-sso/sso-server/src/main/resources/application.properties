server.port=8080

spring.application.name=beenest-sso

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Datasource
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/beenest_sso
spring.datasource.username=postgres
spring.datasource.password=password

# MyBatis Plus
mybatis-plus.mapper-locations=classpath:/mapper/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true

# Sa-Token 配置
sa-token.token-name=satoken
sa-token.timeout=2592000
sa-token.activity-timeout=-1
sa-token.is-concurrent=true
sa-token.is-share=true
sa-token.token-style=uuid
sa-token.is-log=true
# Cookie 配置
sa-token.cookie.domain=
sa-token.cookie.path=/
# 过期时间 (秒), 默认与 token 有效期一致
sa-token.cookie.max-age=2592000

# SSO 自定义配置
sso.jwt.secret=beenest_sso_secret_key_beenest_sso_secret_key_must_be_long_enough
sso.jwt.expiration=86400000
# 必须是 16 字节，用于 AES-128
sso.aes.key=beenest_aes_key_16chars!!
