# 端口
server:
  port: 9000

# Sa-Token 配置
sa-token:
  # token名称（全局）
  token-name: Authorization
  # token前缀
  token-prefix: Bearer
  # 是否允许同一账号并发登录（为true则新登录会在线上踢掉别人）
  is-concurrent: true
  # token 有效期（单位：秒），为0代表永不过期
  timeout: 86400
  # 打印操作日志
  is-log: true
    # SSO-模式一相关配置  (非模式一不需要配置)
  cookie:
    # 配置 Cookie 作用域
    domain: stp.com
  # SSO-Server 配置
  sso-server:
    # Ticket有效期 (单位: 秒)，默认五分钟
    ticket-timeout: 300
    # 应用列表：配置接入的应用信息
    clients:
      # 应用 sso-client1：采用模式一对接 (同域、同Redis)
      sso-client1:
        client: sso-client1
        allow-url: "*"
  # jwt秘钥
  jwt-secret-key: asdasdasifhueuiwyurfewbfjsdafjkads

spring:
  data:
    # Redis配置 （SSO模式一和模式二使用Redis来同步会话）
    redis:
      # Redis数据库索引（默认为0）
      database: 10
      # Redis服务器地址
      host: 127.0.0.1
      # Redis服务器连接端口
      port: 6379
      # Redis服务器连接密码（默认为空）
      password:

  datasource:
    url: jdbc:postgresql://10.88.8.11:30004/beenest
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

